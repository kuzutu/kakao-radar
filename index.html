<title>Kakao Haber Radarı</title>
<style>
:root{--kenar:#e3e7ee;--metin:#1a2330;--soluk:#7a8494;--lacivert:#1f3864;--zemin:#eef1f5;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
  background:var(--zemin);color:var(--metin);font-size:14px;display:flex;flex-direction:column;overflow:hidden}

/* ── Üst çubuk ── */
.ust{padding:12px 16px 10px;background:#fff;border-bottom:1px solid var(--kenar);flex:0 0 auto}
.ust h1{font-size:17px;margin:0 0 8px;display:flex;align-items:center;gap:9px}
.ust h1 small{font-size:11px;font-weight:400;color:var(--soluk)}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--lacivert);color:#fff;border:none;
  border-radius:8px;padding:8px 13px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}
.btn:hover{background:#294a86}
.btn:disabled{opacity:.5;cursor:default}
.btn.sec{background:var(--zemin);color:var(--lacivert)}
.btn.ac{background:#1e8e4e}
input[type=text],select{padding:7px 9px;border:1px solid #cfd6e2;border-radius:8px;font-size:12.5px;
  color:var(--lacivert);background:#fff;font-family:inherit}
input[type=text]{min-width:170px}
.mini{font-size:11px;color:#98a2b3}

/* ── Gövde: liste + görüntüleyici ── */
.govde{flex:1 1 auto;display:flex;flex-direction:column;min-height:0}
.liste{flex:1 1 auto;overflow-y:auto;padding:6px 0}
.liste.kucuk{flex:0 0 34%}

/* ── Haber satırı: sadece başlık + tarih ── */
.satir{display:flex;align-items:baseline;gap:10px;padding:8px 16px;cursor:pointer;
  border-left:3px solid transparent;line-height:1.4}
.satir:hover{background:#e7ecf5}
.satir.secili{background:#dde6f5;border-left-color:var(--lacivert)}
.satir .bas{flex:1 1 auto;font-size:13.5px;font-weight:600;color:var(--metin)}
.satir.okundu .bas{color:#6b7686;font-weight:500}
.satir .trh{flex:0 0 auto;font-size:11px;color:#98a2b3;font-variant-numeric:tabular-nums;white-space:nowrap}
.satir .kyn{flex:0 0 auto;font-size:10.5px;color:#8b95a5;background:#eef2f8;
  border-radius:5px;padding:1px 6px;white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.satir .nokta{flex:0 0 auto;width:7px;height:7px;border-radius:50%;background:#cbd3de}
.satir .nokta.bull{background:#c0392b}
.satir .nokta.bear{background:#1e8e4e}
.satir .lnk{flex:0 0 auto;font-size:11px;font-weight:800;width:16px;text-align:center}
.satir.kirik .bas{color:#c0392b;text-decoration:line-through;text-decoration-color:#e8a8a8}
.gun{padding:9px 16px 4px;font-size:10.5px;font-weight:800;letter-spacing:.05em;
  text-transform:uppercase;color:#98a2b3;background:var(--zemin);position:sticky;top:0;z-index:2}

/* ── Alt pencere ── */
.izle{flex:0 0 66%;display:none;flex-direction:column;border-top:2px solid var(--lacivert);background:#fff;min-height:0}
.izle.acik{display:flex}
.izleUst{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:8px 12px;
  background:#f7f9fc;border-bottom:1px solid var(--kenar)}
.izleUst .ad{flex:1 1 auto;font-size:12.5px;font-weight:700;color:var(--lacivert);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.izle iframe{flex:1 1 auto;width:100%;border:0;background:#fff}
.okuma{flex:1 1 auto;overflow-y:auto;padding:20px 22px 48px;background:#fff;
  -webkit-overflow-scrolling:touch}
.okuma .govde{max-width:680px;margin:0 auto}
.okuma h2{font-size:20px;line-height:1.32;color:var(--lacivert);margin:0 0 4px}
.okuma .kaynakSatir{font-size:12px;color:#7a8494;margin-bottom:18px;
  padding-bottom:12px;border-bottom:1px solid #eef1f5}
.okuma p{font-size:16px;line-height:1.72;color:#1c2430;margin:0 0 15px}
.okuma .yok{color:#7a8494;font-size:14px;line-height:1.7;text-align:center;
  padding:34px 16px}
@media(max-width:820px){ .okuma{padding:16px 16px 40px} .okuma p{font-size:16.5px} }
.tut{flex:0 0 auto;height:6px;background:var(--kenar);cursor:ns-resize}
.tut:hover{background:#b9c3d4}

.durumCubuk{padding:5px 16px;font-size:11px;color:#98a2b3;background:#fff;border-top:1px solid var(--kenar);flex:0 0 auto}
.bos{padding:34px 20px;text-align:center;color:#98a2b3;font-size:13px}
.pnl{position:absolute;inset:auto 16px 44px 16px;max-height:52vh;overflow:auto;background:#fff;
  border:1px solid var(--kenar);border-radius:10px;box-shadow:0 6px 26px rgba(20,30,50,.16);padding:14px;z-index:20}
.pnl.gizli{display:none}
table{border-collapse:collapse;width:100%;font-size:11.5px}
th,td{border:1px solid var(--kenar);padding:5px 7px;text-align:left}
th{background:#eef2f8;font-weight:800;color:#2c3e50}
.uyari{background:#fff8e6;border:1px solid #f0e0a8;border-radius:9px;padding:10px 13px;
  font-size:12px;color:#6b5b1f;margin:8px 16px;line-height:1.55}

/* ══════════ MOBİL DÜZEN ══════════
   Telefonda yan yana bölme çalışmaz. Liste tam ekran; bir habere
   dokununca görüntüleyici üstten kayarak tam ekran açılır. */
body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.geri{display:none}
@media (max-width: 780px){
  body{font-size:15px}
  .ust{padding:10px 12px 8px}
  .ust h1{font-size:16px;margin-bottom:7px}
  .ust h1 small{display:none}
  .bar{gap:6px}
  .btn{padding:9px 12px;font-size:13px}
  input[type=text]{min-width:0;flex:1 1 130px}
  select{flex:0 1 auto;font-size:13px}
  #durum{flex:1 1 100%;margin-top:2px}

  /* Liste: dokunma hedefleri büyük, tarih alta iner */
  .satir{padding:13px 14px;align-items:flex-start;flex-wrap:wrap;gap:8px}
  .satir .bas{flex:1 1 100%;font-size:15px;line-height:1.42;order:2}
  .satir .nokta{order:1;margin-top:6px}
  .satir .lnk{order:1;margin-top:2px}
  .satir .kyn{order:3;max-width:60%}
  .satir .trh{order:4}
  .gun{padding:10px 14px 5px;font-size:11px}

  /* Görüntüleyici: tam ekran katman */
  .liste.kucuk{flex:1 1 auto}
  .tut{display:none !important}
  .izle{position:fixed;inset:0;z-index:60;flex:1 1 auto;border-top:0;
    transform:translateY(100%);transition:transform .22s ease;display:flex}
  .izle.acik{transform:translateY(0)}
  .izleUst{padding:calc(9px + env(safe-area-inset-top)) 10px 9px;gap:6px;flex-wrap:wrap}
  .izleUst .ad{flex:1 1 100%;order:2;font-size:13px;white-space:normal;
    max-height:2.7em;overflow:hidden;line-height:1.35}
  .izleUst .btn{order:3;flex:1 1 auto;justify-content:center;padding:10px 8px;font-size:12.5px}
  .geri{display:inline-flex;order:1;flex:0 0 auto;background:#eef1f5;color:#1f3864;
    border:none;border-radius:8px;padding:8px 12px;font-size:14px;font-weight:800;
    cursor:pointer;font-family:inherit}
  #kapat{display:none}
  #cevirDurumu{order:4;flex:1 1 100%;text-align:center}

  .durumCubuk{padding:7px 14px;font-size:11.5px;
    padding-bottom:calc(7px + env(safe-area-inset-bottom))}
  .pnl{inset:auto 8px 8px 8px;max-height:72vh;padding:11px}
  table{font-size:11px}
  th,td{padding:4px 5px}
}
@media (max-width: 420px){
  .satir .kyn{font-size:10px}
  .ust h1{font-size:15px}
}
/* Dokunmatik: gri vurgu kutusunu kaldır */
*{-webkit-tap-highlight-color:transparent}
.satir{-webkit-user-select:none;user-select:none}
</style>
</head>

function fetchT(url,ms){

const VARLIK={'&lt;':'<','&gt;':'>','&amp;':'&','&quot;':'"','&apos;':"'",'&nbsp;':' ',

  '&hellip;':'…','&#8230;':'…'};
function varlikCoz(t){
  return String(t||'').replace(/&(lt|gt|amp|quot|apos|nbsp|rsquo|lsquo|ldquo|rdquo|ndash|mdash|hellip|#\d+);/g,
    function(m){ return VARLIK[m]!==undefined?VARLIK[m]:(m.charAt(1)==='#'?String.fromCharCode(+m.slice(2,-1)):' '); });
}
function temiz(t){
  let s=varlikCoz(varlikCoz(t));
  s=s.replace(/<[^>]*>/g,' ')
     .replace(/\b(?:href|src|target|rel|style)\s*=\s*["'][^"']*["']/gi,' ')
     .replace(/&[a-z#0-9]{2,8};/gi,' ');
  return s.replace(/\s+/g,' ').trim();
}

async function besleGetir(url){
  try{ const r=await fetchT(url,6000);
       if(r.ok){ const t=await r.text(); const b=bicimBul(t); if(b) return {metin:t,bicim:b,yol:'doğrudan'}; } }catch(e){}
  if(!PROXIES.length) return {hata:'proxy yok'};
  const sira=proxySirasi();
  for(let n=0;n<sira.length;n++){

    await proxySlot();
    try{

}
function ozetIseYarar(o,baslik){
  if(!o) return false;
  const s=o.trim();
  if(s.length<25) return false;
  if(/\bhref\s*=|news\.google\.com/i.test(s)) return false;
  const a=s.toLowerCase().replace(/[^a-z0-9]/g,''), b=(baslik||'').toLowerCase().replace(/[^a-z0-9]/g,'');
  if(b && (a.indexOf(b)>-1 || b.indexOf(a)>-1)) return false;
  return true;
}
function rssAyristir(x){
  const out=[];
  const parcalar = x.indexOf('<item')>-1 ? x.split(/<item[\s>]/i).slice(1) : x.split(/<entry[\s>]/i).slice(1);
  parcalar.forEach(function(it){
    const g=function(tag){
      const m=it.match(new RegExp('<'+tag+'[^>]*>([\\s\\S]*?)<\\/'+tag+'>','i'));
      return m?temiz(m[1].replace(/<!\[CDATA\[|\]\]>/g,'')):'';
    };
    const bas=g('title');
    let lnk=(it.match(/<link[^>]*>([\s\S]*?)<\/link>/i)||[,''])[1].trim();
    if(!lnk){ const a=it.match(/<link[^>]*href=["']([^"']+)["']/i); if(a) lnk=a[1]; }
    const trh=g('pubDate')||g('published')||g('updated')||g('dc:date');
    const ozet=g('description')||g('summary');
    // Google News <source url="..."> ile GERCEK yayinciyi bildirir.
    // Link cozulemezse makaleyi o sitede aramak icin sakliyoruz.
    let kaynakURL='';
    const sm=it.match(/<source[^>]+url=["']([^"']+)["']/i);
    if(sm) kaynakURL=varlikCoz(sm[1]);
    if(bas) out.push({baslik:bas, link:varlikCoz(lnk), tarih:trh?new Date(trh):null,
      kaynak:g('source')||'', kaynakURL:kaynakURL,
      ozet:ozetIseYarar(ozet,bas)?ozet.slice(0,260):''});
  });
  return out;
}

/* Ceviri aynasi YALNIZCA yabanci dilli kaynaklara uygulanir.
   Iki sebep:
     1. Ingilizce haberi cevirmenin bir faydasi yok.
     2. Barchart gibi agir JavaScript kullanan siteler aynadan
        gecince bozuluyor — sablon kodu ham halde ekrana dokuluyor.
        Bu sitelerin hepsi zaten Ingilizce, yani liste ikisini de

        da ekle. */
const CEVRILECEK_ALANLAR=[
  'fratmat.info','aip.ci','sikafinance.com','agenceecofin.com',   // Fransizca
  'investiraucameroun.com',

const AYNA_BOZUK=['barchart.com'];

function cevrilsinMi(u){
  try{
    const a=new URL(u).hostname.replace(/^www\./,'').toLowerCase();
    if(AYNA_BOZUK.some(function(x){return a===x||a.endsWith('.'+x);})) return false;
    return CEVRILECEK_ALANLAR.some(function(x){return a===x||a.endsWith('.'+x);});
  }catch(e){ return false; }
}

function ceviriAdresi(u){
  try{
    const p=new URL(u);
    if(!/^https?:$/.test(p.protocol)) return u;
    if(/\.translate\.goog$/.test(p.hostname)) return u;   // zaten cevrili
    // Google kurali: once tireler ikilenir, sonra noktalar tire olur.
    const h=p.hostname.replace(/-/g,'--').replace(/\./g,'-');
    return 'https://'+h+'.translate.goog'+p.pathname+p.search+
           (p.search?'&':'?')+'_x_tr_sl=auto&_x_tr_tl=tr&_x_tr_hl=tr';
  }catch(e){ return u; }
}

       'Yayıncı sayfayı JavaScript ile üretiyor ya da erişimi kısıtlıyor olabilir.<br><br>'+
       '<b>↗ Yeni sekme</b> ile kaynağında açabilirsin.</div>';
  }
  h+='</div>';
  k.innerHTML=h; k.scrollTop=0;
}

/* ═══════ 4b. HAZIR VERİYİ YÜKLE ═══════
   Asil calisma yontemi budur. Haberleri GitHub Actions saatte bir
   toplayip veri/haberler.json dosyasina yaziyor; burada sadece
   okunuyor. Boylece telefonda proxy, CORS ve acik Mac gerekmez.
   Dosya yoksa (ilk kurulum, dosyadan acma) canli taramaya duser. */
async function tara(){
  const b=document.getElementById('tara'), d=document.getElementById('durum');

  try{
    const r=await fetchT('veri/haberler.json?t='+Date.now(),12000);

  }catch(e){}

  if(!veri||!veri.haberler||!veri.haberler.length){
    // Hazir veri yok: eski yontemle tarayiciden tara.
    b.disabled=false;
    return canliTara();
  }

  HEPSI=veri.haberler.map(function(h){
    const y=Object.assign({},h,{tarih:h.tarih?new Date(h.tarih):null});
    Object.assign(y, tonHesapla(y.baslik+' '+(y.ozet||'')));
    return y;
  }).filter(function(h){ return !cokEski(h.tarih); });
  RAPOR=veri.rapor||[];
  RAPOR.forEach(function(r){ r[5]=tarihAraligi(r[0]); });
  CEVIRI_VAR=HEPSI.some(function(h){return !!h.baslikTR;});

  const yas=veri.uretim?Math.round((Date.now()-new Date(veri.uretim).getTime())/6e4):null;
  d.style.color=HEPSI.length?'#1e8e4e':'#c0392b';
  d.textContent='✓ '+HEPSI.length+' haber · '+
    (veri.calisanKaynak||0)+'/'+(veri.kaynakSayisi||0)+' kaynak';
  document.getElementById('damga').textContent=

                        :('güncellendi '+new Date(veri.uretim).toLocaleString('tr-TR')));
  // Veri 3 saatten eskiyse toplayici calismiyor olabilir; sessiz kalma.
  if(yas!==null && yas>180){
    const u=document.getElementById('proxyUyari');
    u.style.display='block';
    u.innerHTML='<b>⚠ Veri '+Math.round(yas/60)+' saattir güncellenmedi.</b> '+
      'GitHub üzerinde Actions sekmesini açıp son çalışmanın hata verip vermediğine bak.';
  }
  depo('kakaoHaber_v7',{ts:Date.now(),v:HEPSI.slice(0,300).map(function(h){
    return Object.assign({},h,{tarih:h.tarih?h.tarih.toISOString():null});})});
  kaynakFiltreDoldur(); ciz();
  b.disabled=false; b.textContent='🔄 Tara';
}

/* ═══════ 5. LİSTE ═══════ */
function filtrele(){
  const gun=Math.min(+document.getElementById('pencere').value||14, AZAMI_GUN);
  const sinir=Date.now()-gun*864e5;
  const q=document.getElementById('ara').value.trim().toLowerCase();
  const kf=document.getElementById('kaynakF').value, tf=document.getElementById('tonF').value;
  return HEPSI.filter(function(h){
    if(h.tarih && h.tarih.getTime()<sinir) return false;
    if(q && (h.baslik+' '+(h.baslikTR||'')).toLowerCase().indexOf(q)<0) return false;
    if(kf && h.grup!==kf) return false;
    if(tf && h.ton!==tf) return false;
    return true;
  });
}
function gunEtiketi(t){
  if(!t||isNaN(t.getTime())) return 'Tarihsiz';
  const g=gunFarki(t.getTime());
  if(g<=0) return 'Bugün';
  if(g===1) return 'Dün';
  if(g<7) return 'Bu hafta';
  if(g<14) return 'Geçen hafta';
  if(g<31) return 'Bu ay';
  return 'Daha eski';
}
function ciz(){
  const v=filtrele(), L=document.getElementById('liste');
  if(!v.length){ L.innerHTML='<div class="bos">Filtreye uyan haber yok.</div>'; altBilgi(0); return; }
  let h='', sonGun='';
  v.forEach(function(x,i){
    const et=gunEtiketi(x.tarih);
    if(et!==sonGun){ h+='<div class="gun">'+et+'</div>'; sonGun=et; }
    const trh = (x.tarih&&!isNaN(x.tarih.getTime()))
      ? x.tarih.toLocaleDateString('tr-TR',{day:'2-digit',month:'2-digit',year:'2-digit'})
      : '—';
    const ld = x.linkDurum==='ok' ? '<span class="lnk" style="color:#1e8e4e" title="Bağlantı çalışıyor">✓</span>'
             : x.linkDurum==='kirik' ? '<span class="lnk" style="color:#c0392b" title="'+kacir(x.linkNot||'')+'">✗</span>'
             : x.linkDurum==='kontrol' ? '<span class="lnk" style="color:#98a2b3">⋯</span>'
             : '<span class="lnk"></span>';
    h+='<div class="satir'+(OKUNAN[x.link]?' okundu':'')+(x.linkDurum==='kirik'?' kirik':'')+'" data-i="'+i+'">'+
       '<span class="nokta '+x.ton+'"></span>'+ld+
       '<span class="bas"'+((TR_GOSTER&&x.baslikTR)?' title="'+kacir(x.baslik)+'"':'')+'>'+
       kacir((TR_GOSTER&&x.baslikTR)?x.baslikTR:x.baslik)+'</span>'+
       (x.kaynakUyari?'<span class="lnk" style="color:#8a6d1f" title="'+kacir(x.kaynakUyari)+'">🔒</span>':'')+
       '<span class="kyn">'+kacir(x.alan||x.grup)+'</span>'+
       '<span class="trh">'+trh+'</span></div>';
  });
  L.innerHTML=h;
  L.querySelectorAll('.satir').forEach(function(el){
    el.addEventListener('click',function(){ ac(v[+el.dataset.i], el); });
  });
  altBilgi(v.length);
}
function altBilgi(n){
  const v=filtrele();
  let bo=0,ay=0;
  v.forEach(function(h){
    const g=h.tarih?gunFarki(h.tarih.getTime()):30;
    const w=(g<=2?1:g<=7?.8:g<=14?.55:.3)*(h.w||1);
    bo+=h.bo*w; ay+=h.ay*w;
  });
  const top=bo+ay, ham=top>0?(bo-ay)/top:0;
  const skor=ham>=0?ham*0.30:ham*0.20;
  document.getElementById('altDurum').innerHTML=
    n+' haber gösteriliyor · piyasa tonu <b style="color:'+(ham>0.12?'#c0392b':ham<-0.12?'#1e8e4e':'#55606f')+'">'+
    (skor>=0?'+':'−')+Math.abs(skor).toFixed(2).replace('.',',')+'</b> ('+
    (ham>0.12?'boğa':ham<-0.12?'ayı':'dengede')+') · panele girilecek sentiment değeri';
}

/* ═══════ 7. SAYFA ÇEVİRİSİ ═══════
   Sayfa kendi sunucumuzdan geldiği için aynı kaynakta sayılır ve
   iframe'in içine erişebiliriz. Metin düğümlerini toplayıp Google'ın
   ücretsiz çeviri ucundan geçirip yerine yazıyoruz. */
let CEVRILI=false;
function cevirDurum(aktif,mesaj){
  CEVRILI=aktif;
  const b=document.getElementById('cevirBtn');
  b.textContent = aktif ? '↩ Orijinali göster' : '🌐 Türkçeye çevir';
  b.className = aktif ? 'btn sec' : 'btn ac';

  const d=document.getElementById('cevirDurumu');
  if(d) d.innerHTML = mesaj || '';
}
/* Cerceveye yeni sayfa yuklendiginde ceviri durumu her zaman sifirlanir.
   Onceden buton "cevrilmis" durumunda takilip kalabiliyordu; o hâlde
   tiklayinca ceviri degil GERI ALMA deneniyor ve hicbir sey olmuyordu. */
function cerceveYuklendi(){
  const c=document.getElementById('cerceve');
  if(!c || !c.src || c.src==='about:blank') return;
  cevirDurum(false);
}
/* Belgede geri alinacak bir sey var mi? */
function cevrilmisMi(belge){
  try{ return belge.querySelectorAll('[data-orj]').length>0; }catch(e){ return false; }
}
function ceviriOnbellek(){ return depo('ceviriler')||{}; }
function ceviriKaydet(o){
  const k=Object.keys(o);
  if(k.length>1500) k.slice(0,600).forEach(function(a){delete o[a];});
  depo('ceviriler',o);
}
function anahtarla(m){
  let h=0; for(let i=0;i<m.length;i++){ h=((h<<5)-h+m.charCodeAt(i))|0; }
  return 'c'+h;
}
const CEVIRI_UC='https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=tr&dt=t&q=';
/* Hız ayarları. GET adresi ~8000 karakteri aşmamalı; metin URL kodlamasıyla
   yaklaşık iki katına çıktığı için 4000 karakter güvenli üst sınır. */
const UC_AZAMI_KARAKTER=4000;   // bir istekteki toplam metin
const UC_AZAMI_PARCA=45;        // bir istekteki parça sayısı
const ES_ZAMANLI=3;             // aynı anda kaç istek (429 riskini düşürür)
let SON_HATA='';

/* Google gtx ucu TEK q alir. Yanit bicimi:
   [ [ [cevrilen, orijinal, ...], [cevrilen, orijinal, ...] ], null, "kaynakDil" ]
   Yani j[0] cumle dizisidir; her ogenin [0]'i cevrilen parcadir. */
/* Google ucu cok sik istekte 429 dondurur. O durumda bekleyip tekrar
   dener, olmazsa ikinci bir uca gecer. */
const CEVIRI_UCLARI=[
  function(m){ return 'https://translate.googleapis.com/translate_a/single'+
    '?client=gtx&sl=auto&tl=tr&dt=t&q='+encodeURIComponent(m); },
  function(m){ return 'https://clients5.google.com/translate_a/t'+
    '?client=dict-chrome-ex&sl=auto&tl=tr&q='+encodeURIComponent(m); }
];
function bekle(ms){ return new Promise(function(r){ setTimeout(r,ms); }); }

function ceviriAyristir(j){
  // Bicim A: [[[cev,orj,...],[cev,orj,...]], null, "en"]
  if(Array.isArray(j)&&Array.isArray(j[0])&&Array.isArray(j[0][0])){
    return j[0].map(function(p){ return (p&&typeof p[0]==='string')?p[0]:''; }).join('');
  }
  // Bicim B (dict-chrome-ex): ["cevrilen metin","en"] veya ["cevrilen"]
  if(Array.isArray(j)&&typeof j[0]==='string') return j[0];
  if(Array.isArray(j)&&Array.isArray(j[0])&&typeof j[0][0]==='string') return j[0][0];
  return '';
}

async function ceviriHam(metin){
  let sonHata='';
  for(let u=0;u<CEVIRI_UCLARI.length;u++){
    for(let deneme=0;deneme<3;deneme++){
      const uc=CEVIRI_UCLARI[u](metin);
      const adres = YEREL_VAR ? ('/api?url='+encodeURIComponent(uc)) : uc;
      try{
        const r=await fetchT(adres,20000);
        if(r.status===429 || r.status===503){
          sonHata='HTTP '+r.status+' (Google hız sınırı)';
          await bekle(700*(deneme+1)*(deneme+1));
          continue;
        }
        if(!r.ok){ sonHata='HTTP '+r.status; break; }
        const govde=await r.text();
        let j;
        try{ j=JSON.parse(govde); }
        catch(e){ sonHata='Yanıt JSON değil: '+govde.slice(0,50); break; }
        const c=ceviriAyristir(j);
        if(c){ return c; }
        sonHata='Beklenmeyen yanıt biçimi';
        break;
      }catch(e){
        sonHata=e.message||'ağ hatası';
        await bekle(400);
      }
    }
  }
  SON_HATA=sonHata||'bilinmeyen hata';
  throw new Error(SON_HATA);
}

/* Hizli yol: parcalari satir sonuyla birlestirip TEK istekte cevir.
   Google satir sonlarini korur; korumazsa satir sayisi tutmaz ve
   o grup icin tek tek cevirime duseriz. Boylece hem hizli hem guvenli. */
async function ceviriGrup(parcalar){
  if(parcalar.length===1) return [await ceviriHam(parcalar[0])];
  const birlesik=parcalar.join('\n');
  let cev;
  try{ cev=await ceviriHam(birlesik); }catch(e){ return null; }
  const satirlar=cev.split('\n');
  if(satirlar.length===parcalar.length) return satirlar;
  return null;   // eslesmedi -> cagiran tek tek dener
}

async function sayfayiCevir(){
  const c=document.getElementById('cerceve'), b=document.getElementById('cevirBtn');
  let belge;
  try{ belge=c.contentDocument; }catch(e){ belge=null; }
  if(!belge || !belge.body){
    alert('Sayfanın içine erişilemedi.\n\nÇeviri yalnızca yerel sunucu (kakao_sunucu.py) üzerinden açılan sayfalarda çalışır.');
    return;
  }

  if(CEVRILI && cevrilmisMi(belge)){   // gercekten geri alinacak sey var
    belge.querySelectorAll('[data-orj]').forEach(function(el){
      el.textContent=el.getAttribute('data-orj');
    });
    cevirDurum(false,'orijinal'); return;
  }
  // CEVRILI takili kalmis ama sayfada ceviri yok: ceviriye devam et.

  b.disabled=true; b.textContent='⏳ Metinler toplanıyor…';
  const atla={SCRIPT:1,STYLE:1,NOSCRIPT:1,CODE:1,PRE:1,SVG:1,IFRAME:1,TEXTAREA:1};
  const gezgin=belge.createTreeWalker(belge.body,NodeFilter.SHOW_TEXT,{
    acceptNode:function(d){
      if(!d.parentElement) return NodeFilter.FILTER_REJECT;
      if(atla[d.parentElement.tagName]) return NodeFilter.FILTER_REJECT;
      const t=d.nodeValue.trim();
      if(t.length<3 || !/[\p{L}]{2}/u.test(t)) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  const dugumler=[]; let d;
  while((d=gezgin.nextNode())){ dugumler.push(d); if(dugumler.length>=900) break; }
  if(!dugumler.length){ cevirDurum(false); return; }

  const onbellek=ceviriOnbellek();
  // Aynı metin sayfada tekrar edebilir; tek kez çevir.
  const benzersiz=[], nerede={};
  dugumler.forEach(function(n){
    // Satir sonu iceren metin gruplama mantigini bozar; tek satira indir.
    const m=n.nodeValue.trim().replace(/\s*\n\s*/g,' ');
    n.__m=m;
    if(m && nerede[m]===undefined){ nerede[m]=benzersiz.length; benzersiz.push(m); }
  });

  // Uzun metinler makale gövdesidir; menü/altbilgi kısa olur.
  // Uzunları öne alarak kullanıcı asıl içeriği önce görsün.
  const bekleyen=benzersiz.filter(function(m){ return !onbellek[anahtarla(m)]; })
                          .sort(function(a,c){ return c.length-a.length; });
  const gruplar=[]; let g=[], uzunluk=0;
  bekleyen.forEach(function(m){
    if(uzunluk+m.length>UC_AZAMI_KARAKTER || g.length>=UC_AZAMI_PARCA){ gruplar.push(g); g=[]; uzunluk=0; }
    g.push(m); uzunluk+=m.length;
  });
  if(g.length) gruplar.push(g);
  if(!gruplar.length){ /* hepsi önbellekte */ }

  // Gruplar SIRAYLA degil, ES ZAMANLI islenir. Asil hiz kazanci burada.
  let bitti=0, basarili=0, sira=0;
  SON_HATA='';
  const t0=Date.now();
  async function isci(){
    while(sira<gruplar.length){
      const grup=gruplar[sira++];
      let cevrili=null;
      try{ cevrili=await ceviriGrup(grup); }catch(e){}
      if(cevrili){
        grup.forEach(function(m,j){
          if(cevrili[j]){ onbellek[anahtarla(m)]=cevrili[j]; basarili++; }
        });
      }else{
        // Satir eslesmesi tutmadi: bu grubun parcalarini tek tek cevir
        for(let j=0;j<grup.length;j++){
          try{
            const t=await ceviriHam(grup[j]);
            if(t){ onbellek[anahtarla(grup[j])]=t; basarili++; }
          }catch(e){}
        }
      }
      bitti++;
      b.textContent='⏳ %'+Math.round(bitti/gruplar.length*100);
      const d=document.getElementById('cevirDurumu');
      if(d) d.textContent=bitti+'/'+gruplar.length+' parça'+(SON_HATA?' · '+SON_HATA:'');
    }
  }
  const isciler=[];
  for(let i=0;i<Math.min(ES_ZAMANLI,gruplar.length);i++) isciler.push(isci());
  await Promise.all(isciler);
  const gecen=((Date.now()-t0)/1000).toFixed(1);
  ceviriKaydet(onbellek);

  let degisen=0;
  dugumler.forEach(function(n){
    const m=n.__m||n.nodeValue.trim();
    const yeni=onbellek[anahtarla(m)];
    if(!yeni || yeni===m) return;
    const el=n.parentElement;
    if(el && !el.hasAttribute('data-orj')) el.setAttribute('data-orj', el.textContent);
    n.nodeValue=yeni;
    degisen++;
  });
  if(degisen){
    cevirDurum(true,'<b style="color:#1e8e4e">✓ '+degisen+' metin · '+gecen+' sn</b>');
  }else{

      '\n\n'+(/429|hız/.test(SON_HATA||'')

}

/* ═══════ 7b. LİNK KONTROLÜ ═══════
   Her bağlantıyı sunucuya sordurup gerçekten açılıp açılmadığını
   işaretler. Google News linkleri önce gerçek adrese çözülür. */
async function linkleriKontrolEt(){
  const b=document.getElementById('kontrolBtn');
  if(!YEREL_VAR){
    alert('Link kontrolü yerel sunucu gerektirir.\n\nkakao_sunucu.py çalıştır ve '+
          'http://localhost:8000/Kakao_Haber_Radari.html adresini aç.');
    return;
  }
  const v=filtrele().filter(function(h){return !h.linkDurum || h.linkDurum==='kontrol';});
  if(!v.length){
    // hepsi kontrol edilmis: bastan yap
    filtrele().forEach(function(h){ h.linkDurum=null; });
    ciz();
  }
  const liste=filtrele();
  b.disabled=true;
  liste.forEach(function(h){ h.linkDurum='kontrol'; });
  ciz();

  let sira=0, bitti=0, kirik=0;
  async function isci(){
    while(sira<liste.length){
      const h=liste[sira++];
      try{
        const r=await fetchT('/kontrol?url='+encodeURIComponent(h.link)+
          '&alan='+encodeURIComponent(h.alan||'')+
          '&baslik='+encodeURIComponent(h.baslik||''),22000);
        const j=await r.json();
        if(j.ok){
          h.linkDurum='ok';
          if(j.gercek && j.gercek!==h.link){ h.gercekLink=j.gercek; h.link=j.gercek; h.gnewsCozuldu=true; }
          if(j.yontem) h.bulmaYontemi=j.yontem;
        }
        else{ h.linkDurum='kirik'; h.linkNot=j.not||('HTTP '+j.durum); kirik++; }
      }catch(e){ h.linkDurum='kirik'; h.linkNot='ulaşılamadı'; kirik++; }
      bitti++;
      b.textContent='⏳ %'+Math.round(bitti/liste.length*100);
      if(bitti%8===0) ciz();
    }
  }
  const w=[]; for(let i=0;i<Math.min(6,liste.length);i++) w.push(isci());
  await Promise.all(w);
  ciz();
  b.disabled=false; b.textContent='🔗 Linkleri kontrol et';
  document.getElementById('altDurum').innerHTML+=
    ' · <b>link kontrolü:</b> '+(liste.length-kirik)+' çalışıyor, '+
    (kirik?'<b style="color:#c0392b">'+kirik+' kırık</b>':'0 kırık');
}
document.getElementById('kontrolBtn').addEventListener('click',linkleriKontrolEt);

/* ═══════ 8. TANI ═══════ */
document.getElementById('taniBtn').addEventListener('click',function(){
  const k=document.getElementById('tani');
  if(!k.classList.contains('gizli')){ k.classList.add('gizli'); return; }
  const s=RAPOR.slice().sort(function(a,b){
    const ai=/[1-9]\d* haber/.test(a[1])?0:1, bi=/[1-9]\d* haber/.test(b[1])?0:1;
    if(ai!==bi) return ai-bi;
    return ((a[5]&&a[5].yeni)||0)-((b[5]&&b[5].yeni)||0);
  });
  let h='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">'+
        '<b style="font-size:12px;color:#7a8494">KAYNAK TANISI</b>'+
        '<button class="btn sec" onclick="document.getElementById(\'tani\').classList.add(\'gizli\')">✕</button></div>'+
        '<table><tr><th>Kaynak</th><th>Sonuç</th><th>En yeni</th><th>Süre</th><th>Yol</th><th>Besleme</th></tr>';
  (s.length?s:[['—','tarama yok',0,'','',null,0]]).forEach(function(r){
    const iyi=/[1-9]\d* haber/.test(r[1]);
    const a=r[5]||{}, yas=gunFarki(a.yeni||null);
    let tz='—', rk='#98a2b3';
    if(yas!==null){
      tz=new Date(a.yeni).toLocaleDateString('tr-TR',{day:'2-digit',month:'2-digit'})+' ('+yas+'g)';
      rk = yas<=3?'#1e8e4e' : yas<=14?'#55606f' : yas<=45?'#8a6d1f' : '#c0392b';
    }
    h+='<tr><td>'+kacir(r[0])+'</td>'+
       '<td style="color:'+(iyi?'#1e8e4e':'#c0392b')+';font-weight:700">'+kacir(r[1])+
       (r[6]?'<br><span style="font-weight:400;color:#98a2b3">+'+r[6]+' eski elendi</span>':'')+'</td>'+
       '<td style="color:'+rk+';font-weight:700">'+tz+'</td>'+
       '<td>'+r[2]+'ms</td><td>'+kacir(r[4]||'—')+'</td>'+
       '<td style="word-break:break-all;color:#98a2b3">'+kacir((r[3]||'').slice(0,46))+'</td></tr>';
  });
  h+='</table><div class="mini" style="margin-top:6px">Protokol: <b>'+location.protocol+'</b> · '+
     'Yerel sunucu: <b style="color:'+(YEREL_VAR?'#1e8e4e':'#c0392b')+'">'+
     (YEREL_VAR?'etkin':'YOK')+'</b> · Çalışan proxy: <b>'+
     (PROXIES.length?PROXIES.map(function(x){return x.ad;}).join(', '):'hiçbiri')+'</b> · '+
     'Azami geriye bakış: <b>'+AZAMI_GUN+' gün</b></div>';
  k.innerHTML=h; k.classList.remove('gizli');
});

/* Telefonda donanım "geri" tuşu / kaydırma jesti görüntüleyiciyi kapatsın,

window.addEventListener('popstate',function(){
  const izle=document.getElementById('izle');

function kapatGorunum(gecmistenGeldi){
  const ok=document.getElementById('okuma');
  if(ok){ ok.style.display='none'; ok.innerHTML=''; }
  const cf=document.getElementById('cerceve');
  if(cf && !YEREL_VAR) cf.style.display='none';
  document.getElementById('izle').classList.remove('acik');
  document.getElementById('tut').style.display='none';
  document.getElementById('liste').classList.remove('kucuk');
  document.getElementById('cerceve').src='about:blank';
  SECILI=null;
  if(!gecmistenGeldi && history.state && history.state.gorunum){
    try{ history.back(); }catch(e){}
  }
}

/* ═══════ 8c. SÜRÜM DENETİMİ ═══════
   HTML ile sunucu farklı sürümdeyse özellikler sessizce çalışmaz
   (ör. eski sunucuda sade görünüm yok → video geri gelir).
   Bunu görünür yapıyoruz. */
const BEKLENEN_SURUM='2026.08.27';
(async function(){
  if(location.protocol==='file:') return;
  // Pages'te kakao_sunucu.py yok; surum denetimi anlamsiz.
  if(!(await yerelVarMi())) return;
  try{
    const r=await fetchT('/surum',6000);
    if(!r.ok) throw new Error('yok');
    const j=await r.json();
    if(j.surum===BEKLENEN_SURUM) return;
    surumUyari('Sunucu sürümü <b>'+kacir(j.surum||'bilinmiyor')+'</b>, '+
      'uygulama <b>'+BEKLENEN_SURUM+'</b> bekliyor.');
  }catch(e){
    surumUyari('Sunucu sürümü okunamadı — <b>kakao_sunucu.py eski olabilir</b>.');
  }
})();
function surumUyari(metin){
  const k=document.createElement('div');
  k.style.cssText='position:fixed;left:0;right:0;top:0;z-index:95;background:#fdecec;'+
    'border-bottom:2px solid #c0392b;color:#8a2b2b;padding:11px 14px;font-size:12.5px;'+
    'line-height:1.55;padding-top:calc(11px + env(safe-area-inset-top))';
  k.innerHTML='⚠ <b>Sürüm uyuşmazlığı.</b> '+metin+
    '<br>Otomatik video engelleme ve sade görünüm düzgün çalışmayabilir. '+
    'Her iki dosyayı da (<b>kakao_sunucu.py</b> ve <b>Kakao_Haber_Radari.html</b>) '+
    'yeniden kopyalayıp sunucuyu yeniden başlat.'+
    '<div style="text-align:right;margin-top:7px"><button id="surumKapat" '+
    'style="background:#c0392b;color:#fff;border:none;border-radius:7px;'+
    'padding:6px 13px;font-weight:800;font-size:12px">Tamam</button></div>';
  document.body.appendChild(k);
  document.getElementById('surumKapat').addEventListener('click',function(){k.remove();});
}
