name: Kakao haber topla

on:
  schedule:
    # Saat basi (dakika 0) dunyadaki tum workflow'larin kuyruga girdigi
    # andir; GitHub ucretsiz katmanda o turlari geciktirir, bazen atlar.
    # "4 saattir guncellenmedi" uyarilarinin sebebi buydu.
    #
    # Iki degisiklik: (1) dakika 0'dan uzaklastik, (2) saatte iki kez
    # calisiyoruz. Biri atlanirsa digeri yakalar, bosluk 1 saati gecmez.
    # Public repoda Actions dakikalari ucretsiz, ek maliyeti yok.
    - cron: "13,43 * * * *"
  workflow_dispatch:        # Actions sekmesindeki "Run workflow" dugmesi
  push:
    paths:
      - "index.html"        # kaynak listesi degisince hemen yeniden topla
      - "topla.py"

permissions:
  contents: write

# Bir onceki calisma bitmeden yenisi baslamasin (ayni dosyaya yazarlar)
concurrency:
  group: topla
  cancel-in-progress: false

jobs:
  topla:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      # v4/v5 Node 20 uzerinde kosuyordu. GitHub Node 20'yi 16 Eylul
      # 2026'da runner'lardan kaldiriyor; o tarihten sonra bu tur
      # tamamen calismaz. v6'lar Node 24 yerlisi, girdi/cikti API'si ayni.
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Bagimliliklar
        run: pip install -r requirements.txt

      - name: Haberleri topla
        env:
          CEVIR: "1"        # basliklari ve makaleleri Turkce'ye cevir
          MAKALE: "1"       # makale govdesini cikar (reklamsiz okuyucu)
        run: python topla.py

      - name: Sonucu isle
        run: |
          git config user.name  "kakao-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add veri/
          if git diff --staged --quiet; then
            echo "Degisiklik yok, islenecek bir sey yok."
            exit 0
          fi
          git commit -m "veri: $(date -u '+%Y-%m-%d %H:%M UTC')"
          # Bu arada baska bir islem push etmis olabilir
          git pull --rebase --autostash origin ${{ github.ref_name }}
          git push
